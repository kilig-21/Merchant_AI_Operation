spring.application.name=Merchant_AI_Operation


spring.datasource.url=jdbc:mysql://localhost:3307/ai_commerce?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#灵活的使用flyway:
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#IDEA 环境变量里配的 JWT 密钥：JWT_SECRET=...
app.jwt.secret=${JWT_SECRET}
#第一版 token 有效 2 小时，够学习项目使用。
app.jwt.expire-hours=2

# Redis 连接和命令超时时间
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

# RabbitMQ 连接配置
#5672  给 Spring Boot 程序连接
#15672 给浏览器打开 RabbitMQ 管理页面
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}

# 发布确认
spring.rabbitmq.publisher-confirm-type=correlated
#开启退回通知
spring.rabbitmq.publisher-returns=true
#要求无法路由的消息必须退回，不能悄悄丢掉
spring.rabbitmq.template.mandatory=true

# 关闭订单消费者必须自行决定何时确认消息
spring.rabbitmq.listener.simple.acknowledge-mode=manual