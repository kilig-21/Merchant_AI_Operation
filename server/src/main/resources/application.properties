spring.application.name=Merchant_AI_Operation


spring.datasource.url=jdbc:mysql://localhost:3307/ai_commerce?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#灵活的使用flyway:
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#IDEA 环境变量里配的 JWT 密钥：JWT_SECRET=...
app.jwt.secret=${JWT_SECRET}
#第一版 token 有效 2 小时，够学习项目使用。
app.jwt.expire-hours=2

